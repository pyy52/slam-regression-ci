name: Publish to PyPI

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]  # full semver only; movable tags (v0) do not build/publish
  workflow_dispatch:

jobs:
  version-check:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Tag version must match pyproject and package version
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;  # full semver release tag: verify it
            *) echo "movable or non-semver tag ($GITHUB_REF_NAME), skipping"; exit 0 ;;
          esac
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          PACKAGE_VERSION="$(grep -m1 '__version__' src/slam_regression/__init__.py | cut -d'"' -f2)"
          echo "tag=$TAG_VERSION pyproject=$PYPROJECT_VERSION package=$PACKAGE_VERSION"
          test "$TAG_VERSION" = "$PYPROJECT_VERSION"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - name: Metadata check
        run: python -m twine check dist/*
      - name: Wheel smoke test in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/slam-regression --version
          /tmp/smoke/bin/slam-regression compare \
            --baseline examples/baseline_metrics.json \
            --reference examples/reference.tum \
            --estimate examples/baseline.tum \
            --config examples/regression.yaml
          set +e
          /tmp/smoke/bin/slam-regression compare \
            --baseline examples/baseline_metrics.json \
            --reference examples/reference.tum \
            --estimate examples/candidate_degraded.tum \
            --config examples/regression.yaml > /dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [version-check, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
