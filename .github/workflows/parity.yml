name: Metric parity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with evo
        run: |
          python -m pip install --upgrade pip
          pip install . evo
      - name: Check ATE/RPE parity against evo
        run: python scripts/evo_parity.py
